<svg width="100%" viewBox="0 0 980 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
<title>riskledger pipeline architecture</title>
<desc>Flux complet: generare de date in PostgreSQL, orchestrata de Airflow, transformata de dbt intr-un model dimensional, cu detectie de anomalii si servire prin Grafana cu control de acces</desc>

<rect x="0" y="0" width="980" height="420" fill="#ffffff"/>
<text x="490" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1d21">riskledger — end-to-end pipeline</text>
<text x="490" y="49" text-anchor="middle" font-size="12" fill="#6b7076">All five layers running, orchestrated on a schedule</text>

<defs><marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#5b5f66" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<!-- Row 1: source data -->
<rect x="30" y="80" width="170" height="60" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
<text x="115" y="105" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0C447C">PostgreSQL</text>
<text x="115" y="122" text-anchor="middle" font-size="10" fill="#185FA5">accounts, transactions</text>
<text x="115" y="134" text-anchor="middle" font-size="9" fill="#4a7ba8">2M rows, partitioned by year</text>

<line x1="200" y1="110" x2="235" y2="110" stroke="#5b5f66" stroke-width="1.3" marker-end="url(#a1)"/>

<rect x="235" y="80" width="150" height="60" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="310" y="105" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3C3489">Airflow</text>
<text x="310" y="122" text-anchor="middle" font-size="10" fill="#534AB7">check_data_freshness</text>
<text x="310" y="134" text-anchor="middle" font-size="9" fill="#6a62c2">run_dbt_pipeline (@daily)</text>

<line x1="385" y1="110" x2="420" y2="110" stroke="#5b5f66" stroke-width="1.3" marker-end="url(#a1)"/>

<rect x="420" y="80" width="150" height="60" rx="10" fill="#FCEFE9" stroke="#F0C2AB" stroke-width="1"/>
<text x="495" y="105" text-anchor="middle" font-size="12.5" font-weight="600" fill="#712B13">dbt</text>
<text x="495" y="122" text-anchor="middle" font-size="10" fill="#993C1D">staging → marts</text>
<text x="495" y="134" text-anchor="middle" font-size="9" fill="#a8542e">dbt run → dbt test (9 tests)</text>

<line x1="570" y1="110" x2="605" y2="110" stroke="#5b5f66" stroke-width="1.3" marker-end="url(#a1)"/>

<rect x="605" y="80" width="180" height="60" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="695" y="102" text-anchor="middle" font-size="12.5" font-weight="600" fill="#085041">star schema</text>
<text x="695" y="119" text-anchor="middle" font-size="10" fill="#0F6E56">fact_transactions</text>
<text x="695" y="132" text-anchor="middle" font-size="9" fill="#1a8a6c">dim_account · dim_employee · dim_date</text>

<line x1="785" y1="110" x2="820" y2="110" stroke="#5b5f66" stroke-width="1.3" marker-end="url(#a1)"/>

<rect x="820" y="80" width="130" height="60" rx="10" fill="#FDEFF4" stroke="#E0679B" stroke-width="1"/>
<text x="885" y="102" text-anchor="middle" font-size="12.5" font-weight="600" fill="#8a1f4f">fact_risk_flags</text>
<text x="885" y="119" text-anchor="middle" font-size="9.5" fill="#b23a71">3-sigma rule on</text>
<text x="885" y="132" text-anchor="middle" font-size="9.5" fill="#b23a71">daily volume/employee</text>

<!-- Row 2: serving -->
<line x1="885" y1="140" x2="885" y2="190" stroke="#5b5f66" stroke-width="1.3" marker-end="url(#a1)"/>
<line x1="885" y1="190" x2="500" y2="190" stroke="#5b5f66" stroke-width="1.3"/>
<line x1="500" y1="190" x2="500" y2="215" stroke="#5b5f66" stroke-width="1.3" marker-end="url(#a1)"/>

<rect x="380" y="215" width="240" height="60" rx="10" fill="#FFF7E6" stroke="#E0A83D" stroke-width="1"/>
<text x="500" y="240" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7a5300">Grafana</text>
<text x="500" y="257" text-anchor="middle" font-size="10" fill="#a37a1a">Risk Alerts + Daily Volume dashboard</text>
<text x="500" y="269" text-anchor="middle" font-size="9" fill="#b8912f">viewer-role account (compliance_viewer)</text>

<text x="490" y="330" text-anchor="middle" font-size="11" fill="#6b7076">Airflow enforces the dbt_run → dbt_test dependency; a failed transform never reaches the dashboard</text>
<text x="490" y="350" text-anchor="middle" font-size="10.5" fill="#8e9297">Custom Airflow image (Dockerfile.airflow) bundles dbt-postgres, so orchestration and transformation share one runtime</text>
</svg>
